<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<style>
:root{
  --ground:#f3c63f;--body:#2457d6;--body-ink:#ffffff;--ink:#14161f;
  --key:#ffffff;--key-ink:#14161f;--sel:#f3c63f;--sel-ink:#14161f;--hot:#d92d3a;--hot-ink:#ffffff;
  --panel:#fffdf6;--ov-ink:#14161f;--ov-mute:#4b5160;
  --board-a:#f6f8fb;--board-b:#edf1f7;--line:#d5dae3;--snake:#2457d6;--head:#173a9a;--food:#d92d3a;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e111a;--body:#22306b;--body-ink:#eef1ff;--ink:#05060a;
    --key:#eef1ff;--key-ink:#10142a;--sel:#f3c63f;--sel-ink:#14161f;--hot:#ff6470;--hot-ink:#1a0a0c;
    --panel:#161a24;--ov-ink:#eef1ff;--ov-mute:#a3acc2;
    --board-a:#1d222d;--board-b:#212734;--line:#2d3444;--snake:#6c97ff;--head:#a9c2ff;--food:#ff6470;
  }
}
:root[data-theme="dark"]{
  --ground:#0e111a;--body:#22306b;--body-ink:#eef1ff;--ink:#05060a;
  --key:#eef1ff;--key-ink:#10142a;--sel:#f3c63f;--sel-ink:#14161f;--hot:#ff6470;--hot-ink:#1a0a0c;
  --panel:#161a24;--ov-ink:#eef1ff;--ov-mute:#a3acc2;
  --board-a:#1d222d;--board-b:#212734;--line:#2d3444;--snake:#6c97ff;--head:#a9c2ff;--food:#ff6470;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--body-ink);min-height:100vh;min-height:100dvh;font:16px/1.4 var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  display:flex;justify-content:center;align-items:flex-start;padding:22px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}

.console{width:100%;max-width:clamp(320px,calc(100vh - 380px),620px);background:var(--body);border:3px solid var(--ink);border-radius:28px;
  padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 9px 0 var(--ink)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font:400 50px/0.95 var(--display);letter-spacing:-.01em}
.gauge{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-bottom:3px}
.pips{display:flex;align-items:flex-end;gap:4px}
.pips i{width:9px;height:calc(6px + var(--n) * 2.2px);border-radius:3px;background:rgba(255,255,255,.26);border:2px solid var(--ink)}
.pips i.on{background:var(--sel)}
.gtxt{font-size:13px;font-weight:600}
.gtxt b{font-variant-numeric:tabular-nums}

.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px 6px}
.cell span{display:block;font-size:12px;color:rgba(255,255,255,.7)}
.cell b{font:400 38px/1.05 var(--display);font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center}
#score{color:var(--sel)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
#score.pop{animation:pop .3s ease-out}

.screen{background:var(--ink);padding:10px;border-radius:18px}
.board{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--board-a);touch-action:none}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:color-mix(in srgb,var(--panel) 84%,transparent);padding:20px}
.ov.hide{display:none}
.ov h2{margin:0;font:400 42px/1 var(--display);color:var(--ov-ink)}
.ov p{margin:0 0 8px;color:var(--ov-mute);max-width:28ch;font-size:15px}

button{font:700 15px var(--ui);cursor:pointer;color:var(--key-ink);background:var(--key);border:3px solid var(--ink);
  border-radius:13px;padding:9px 12px;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active,button[aria-pressed="true"]{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
button:disabled{opacity:.5;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
button.hot{background:var(--hot);color:var(--hot-ink);font:400 22px var(--display);padding:11px 30px;box-shadow:0 5px 0 var(--ink)}
button.hot:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:10px}
.row button{flex:1}

.pad{display:none;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,58px);gap:10px;justify-content:center}
.pad button{padding:0;font-size:20px;touch-action:manipulation}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (pointer:coarse),(max-width:560px){.pad{display:grid}}

.touch-only{display:none}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;font-weight:600}
kbd{font:700 12px var(--ui);background:var(--key);color:var(--key-ink);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-right:4px;box-shadow:0 2px 0 var(--ink)}
@media (max-width:380px){h1{font-size:40px}.cell b{font-size:30px}}
@media (pointer:coarse){.kbd-only{display:none}.touch-only{display:inline}}
@media (orientation:portrait) and (max-height:820px){
  body{padding-top:10px;padding-bottom:22px}
  .console{gap:10px;padding:12px 12px 14px;border-radius:24px}
  h1{font-size:30px}
  .gauge{flex-direction:row;align-items:flex-end;gap:10px}
  .cell{padding:6px 12px 4px}
  .cell b{font-size:28px}
  .screen{width:min(100%,max(260px,calc(100vh - 390px)));width:min(100%,max(260px,calc(100dvh - 390px)));margin-inline:auto}
  button{padding:6px 10px}
  .pad{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,48px);gap:8px}
}
@media (orientation:landscape) and (max-height:560px){
  body{padding-top:8px;padding-bottom:12px;align-items:center}
  .console{width:max-content;max-width:100%;margin-inline:auto;display:grid;grid-template-columns:min(calc(100vh - 60px),50vw) minmax(240px,320px);grid-template-columns:min(calc(100dvh - 60px),50vw) minmax(240px,320px);column-gap:16px;row-gap:10px;align-content:start;padding:12px 14px 14px;box-shadow:0 6px 0 var(--ink)}
  .screen{grid-column:1;grid-row:1 / span 7;width:auto;margin:0}
  .console > *:not(.screen){grid-column:2}
  h1{font-size:32px}
  .cell b{font-size:28px}
  .cell{padding:6px 12px 4px}
  button{padding:6px 10px}
  .pad{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,46px);gap:8px}
}
@media (min-width:900px) and (min-height:800px){.cell b{font-size:44px}h1{font-size:58px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="console">
  <div class="top">
    <h1>Snake</h1>
    <div class="gauge">
      <div class="pips" id="pips" aria-hidden="true"><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i></div>
      <div class="gtxt">Speed <b id="speed">1.0x</b></div>
    </div>
  </div>

  <div class="scoreboard">
    <div class="cell"><span>Score</span><b id="score">0</b></div>
    <div class="cell"><span>High score</span><b id="best">0</b></div>
  </div>

  <div class="screen">
    <div class="board">
      <canvas id="c" aria-label="Snake game board"></canvas>
      <div class="ov" id="ov">
        <h2 id="ovT">Snake</h2>
        <p id="ovP">Eat food, grow longer, don’t hit yourself.</p>
        <button class="hot" id="ovB">Start</button>
      </div>
    </div>
  </div>

  <div class="seg" id="speedSeg">
    <button data-v="0" aria-pressed="false">Slow</button>
    <button data-v="1" aria-pressed="true">Normal</button>
    <button data-v="2" aria-pressed="false">Fast</button>
  </div>

  <div class="row">
    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
    <button id="soundBtn" aria-pressed="true">Sound: on</button>
  </div>

  <div class="pad" aria-label="Direction controls">
    <button class="u" data-d="up" aria-label="Up">&#9650;</button>
    <button class="l" data-d="left" aria-label="Left">&#9664;</button>
    <button class="d" data-d="down" aria-label="Down">&#9660;</button>
    <button class="r" data-d="right" aria-label="Right">&#9654;</button>
  </div>

  <div class="keys">
    <span class="touch-only">Swipe on the screen or use the arrows</span>
    <span class="kbd-only"><kbd>Arrows</kbd><kbd>WASD</kbd>move</span>
    <span class="kbd-only"><kbd>Space</kbd>pause</span>
    <span class="kbd-only"><kbd>R</kbd>restart</span>
  </div>
</main>

<script>
(function(){
  var N = 20;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var $ = function(id){ return document.getElementById(id); };
  var scoreEl = $('score'), bestEl = $('best'), speedEl = $('speed'), ov = $('ov'), ovT = $('ovT'), ovP = $('ovP'), ovB = $('ovB');
  var pauseBtn = $('pauseBtn'), soundBtn = $('soundBtn');
  if (!ctx.roundRect) ctx.roundRect = function(x,y,w,h){ this.rect(x,y,w,h); };

  var SPEEDS = [120, 85, 55];
  var DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  var speedIdx = 1, wrap = true, sound = true;
  var snake, old, dir, queue, food, score, state, acc, flash, dieT = 0, newBest = false, shake = 0, effects = [], bests = {}, colors = {};
  var lastTs = 0, audio = null;

  /* storage (per-viewer convenience, guarded) */
  function key(){ return 'snake-high-score'; }
  function loadBest(){
    var k = key();
    if (bests[k] == null) {
      var v = 0;
      try { v = parseInt(localStorage.getItem(k), 10) || 0; } catch (e) {}
      bests[k] = v;
    }
    return bests[k];
  }
  function saveBest(v){
    bests[key()] = v;
    try { localStorage.setItem(key(), String(v)); } catch (e) {}
  }

  /* sound */
  function beep(freq, dur, type){
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.06, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  /* layout and colors */
  function readColors(){
    var s = getComputedStyle(document.documentElement);
    ['board-a','board-b','snake','head','food','ink'].forEach(function(n){ colors[n] = s.getPropertyValue('--' + n).trim(); });
  }
  function resize(){
    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth;
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
    readColors();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });
  if (window.ResizeObserver) new ResizeObserver(function(){ if (cv.width !== Math.round(cv.clientWidth * (window.devicePixelRatio || 1))) resize(); }).observe(cv);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors);
  }

  /* game state */
  function copy(a){ return a.map(function(s){ return {x:s.x, y:s.y}; }); }
  function reset(){
    var m = N >> 1;
    snake = [{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];
    old = copy(snake);
    dir = {x:1,y:0}; queue = []; score = 0; acc = 0; flash = 0; dieT = 0; shake = 0; newBest = false; effects = [];
    placeFood();
    state = 'ready';
    updateHud(); showOverlay();
  }
  function placeFood(){
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if (x > 0 && y > 0 && x < N - 1 && y < N - 1 && !snake.some(function(s){ return s.x === x && s.y === y; })) free.push({x:x,y:y});
    }
    if (!free.length) {
      for (var a = 0; a < N; a++) for (var b = 0; b < N; b++) {
        if (!snake.some(function(s){ return s.x === a && s.y === b; })) free.push({x:a,y:b});
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }
  function tickMs(){
    var base = SPEEDS[speedIdx];
    return Math.max(base * 0.45, base * (1 - score * 0.02));
  }
  var shownScore = 0;
  function updateHud(){
    scoreEl.textContent = score;
    speedEl.textContent = (SPEEDS[speedIdx] / tickMs()).toFixed(1) + 'x';
    var ratio = SPEEDS[speedIdx] / tickMs(), lit = Math.max(1, Math.min(8, Math.round(1 + (ratio - 1) / (1 / 0.45 - 1) * 7)));
    var pips = document.querySelectorAll('#pips i');
    for (var q = 0; q < pips.length; q++) pips[q].className = q < lit ? 'on' : '';
    if (score > shownScore) { scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop'); }
    shownScore = score;
    bestEl.textContent = loadBest();
    pauseBtn.textContent = state === 'paused' ? 'Resume' : 'Pause';
    pauseBtn.disabled = state === 'ready' || state === 'over' || state === 'dying';
  }
  function showOverlay(){
    if (state === 'play' || state === 'dying') { ov.classList.add('hide'); return; }
    ov.classList.remove('hide');
    if (state === 'ready') { ovT.textContent = 'Snake'; ovP.textContent = 'Eat food, grow longer, don\u2019t hit yourself.'; ovB.textContent = 'Start'; }
    if (state === 'ready' && loadBest()) ovP.textContent = 'High score: ' + loadBest();
    if (state === 'paused') { ovT.textContent = 'Paused'; ovP.textContent = 'Press Space or Resume to keep going.'; ovB.textContent = 'Resume'; }
    if (state === 'over') {
      ovT.textContent = 'Game over';
      ovP.textContent = newBest ? 'New high score: ' + score : 'Score ' + score + '. High score: ' + loadBest() + '.';
      ovB.textContent = 'Play again';
    }
  }
  function start(){ state = 'play'; showOverlay(); updateHud(); beep(520, 0.08); }
  function togglePause(){
    if (state === 'play') { state = 'paused'; }
    else if (state === 'paused') { state = 'play'; }
    else return;
    showOverlay(); updateHud();
  }
  function die(){
    state = 'dying'; dieT = 0; shake = 1; flash = 1; beep(120, 0.35, 'sawtooth');
    if (score > loadBest()) saveBest(score);
    updateHud(); showOverlay();
  }
  function step(){
    if (queue.length) dir = queue.shift();
    var h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (wrap) { h.x = (h.x + N) % N; h.y = (h.y + N) % N; }
    else if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) return die();
    var eating = food && h.x === food.x && h.y === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    if (body.some(function(s){ return s.x === h.x && s.y === h.y; })) return die();
    old = copy(snake);
    snake.unshift(h);
    if (!eating) snake.pop();
    else {
      score++;
      effects.push({x:food.x, y:food.y, t:0});
      beep(660 + Math.min(score, 20) * 12, 0.09);
      placeFood();
      if (score > loadBest()) { saveBest(score); newBest = true; }
      updateHud();
      if (!food) { saveBest(score); die(); }
    }
  }

  /* input */
  function turn(name){
    var d = DIRS[name]; if (!d) return;
    if (state !== 'ready' && state !== 'play') return;
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -ref.x && d.y === -ref.y) { if (state === 'ready') start(); return; }
    if (d.x === ref.x && d.y === ref.y) { if (state === 'ready') start(); return; }
    if (queue.length < 2) queue.push(d);
    if (state === 'ready') start();
    if (state === 'over') return;
  }
  var KEYS = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  window.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (KEYS[e.key]) {
      e.preventDefault();
      if (state === 'over') return;
      turn(KEYS[e.key]);
    } else if (e.key === ' ') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      if (state === 'ready' || state === 'over') primary(); else togglePause();
    } else if (e.key === 'r' || e.key === 'R') { reset(); }
    else if (e.key === 'p' || e.key === 'P') { togglePause(); }
  });
  var tx = 0, ty = 0, tracking = false;
  var consoleEl = document.querySelector('.console');
  consoleEl.addEventListener('touchstart', function(e){
    if (e.target.closest('button')) { tracking = false; return; }
    if (state === 'ready' && !e.target.closest('.board')) { tracking = false; return; }
    var t = e.touches[0]; tx = t.clientX; ty = t.clientY; tracking = true;
  }, {passive:true});
  consoleEl.addEventListener('touchmove', function(e){
    if (!tracking) return;
    if (state === 'play' || state === 'ready') e.preventDefault();
    var t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    tx = t.clientX; ty = t.clientY;
  }, {passive:false});
  consoleEl.addEventListener('touchend', function(){ tracking = false; }, {passive:true});
  consoleEl.addEventListener('touchcancel', function(){ tracking = false; }, {passive:true});
  Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function(b){
    b.addEventListener('pointerdown', function(e){ e.preventDefault(); turn(b.getAttribute('data-d')); });
    b.addEventListener('click', function(e){ if (e.detail === 0) turn(b.getAttribute('data-d')); });
  });

  function primary(){
    if (state === 'ready') start();
    else if (state === 'paused') togglePause();
    else if (state === 'over') { reset(); start(); }
  }
  ovB.addEventListener('click', primary);
  pauseBtn.addEventListener('click', togglePause);
  $('restartBtn').addEventListener('click', reset);
  soundBtn.addEventListener('click', function(){
    sound = !sound;
    soundBtn.setAttribute('aria-pressed', String(sound));
    soundBtn.textContent = 'Sound: ' + (sound ? 'on' : 'off');
  });
  function seg(id, fn){
    var el = $(id);
    el.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call(el.children, function(c){ c.setAttribute('aria-pressed', String(c === b)); });
      fn(parseInt(b.getAttribute('data-v'), 10));
      reset();
    });
  }
  seg('speedSeg', function(v){ speedIdx = v; });
  
  document.addEventListener('visibilitychange', function(){ if (document.hidden && state === 'play') togglePause(); });

  /* rendering */
  function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function pos(i, t){
    var n = snake[i], o = old[Math.min(i, old.length - 1)];
    if (Math.abs(n.x - o.x) > 1 || Math.abs(n.y - o.y) > 1) return n;
    return {x: lerp(o.x, n.x, t), y: lerp(o.y, n.y, t)};
  }
  var bgc = null, bgKey = '';
  function buildBoard(cs, W){
    bgc = document.createElement('canvas'); bgc.width = bgc.height = W;
    var g = bgc.getContext('2d'), ins = cs * 0.05;
    if (!g.roundRect) g.roundRect = function(x,y,w,h){ this.rect(x,y,w,h); };
    g.fillStyle = colors['board-a']; g.fillRect(0, 0, W, W);
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      g.fillStyle = colors['board-b'];
      g.beginPath(); g.roundRect(x * cs + ins, y * cs + ins, cs - ins * 2, cs - ins * 2, cs * 0.2); g.fill();
      if ((x + y) % 2) {
        g.globalAlpha = 0.07; g.fillStyle = colors.snake;
        g.beginPath(); g.roundRect(x * cs + ins, y * cs + ins, cs - ins * 2, cs - ins * 2, cs * 0.2); g.fill();
        g.globalAlpha = 1;
      }
    }
  }
  function dot(x, y, r){ if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function draw(ts){
    var cs = cv.width / N, W = cv.width, i, j, k;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, W);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * cs * 0.35, (Math.random() - 0.5) * shake * cs * 0.35);
    var bk = W + colors['board-a'] + colors['board-b'] + colors.snake;
    if (!bgc || bgKey !== bk) { buildBoard(cs, W); bgKey = bk; }
    ctx.drawImage(bgc, 0, 0);
    var t = (state === 'play' || state === 'paused') ? Math.min(acc / tickMs(), 1) : 1;
    var dying = state === 'dying' || state === 'over';

    /* food: apple with leaf, shadow and a gentle bob */
    if (food) {
      var wob = Math.sin(ts / 260), fx = (food.x + 0.5) * cs, base = (food.y + 0.5) * cs;
      var fy = base + wob * cs * 0.04, fr = cs * 0.34 * (1 + wob * 0.04);
      ctx.fillStyle = 'rgba(20,22,31,0.16)';
      ctx.beginPath(); ctx.ellipse(fx, base + cs * 0.34, fr * 0.8, fr * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = colors.ink; ctx.lineWidth = cs * 0.06; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx, fy - fr * 0.7); ctx.lineTo(fx - fr * 0.12, fy - fr * 1.2); ctx.stroke();
      ctx.fillStyle = '#3aa655';
      ctx.beginPath(); ctx.ellipse(fx + fr * 0.5, fy - fr * 1.0, fr * 0.45, fr * 0.2, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = colors.food;
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(fx - fr * 0.42, fy - fr * 0.35, fr * 0.16, fr * 0.3, 0.6, 0, Math.PI * 2); ctx.fill();
    }
    /* eat burst: ring plus flying chips */
    for (i = effects.length - 1; i >= 0; i--) {
      var ef = effects[i]; ef.t += 0.04;
      if (ef.t >= 1) { effects.splice(i, 1); continue; }
      var ecx = (ef.x + 0.5) * cs, ecy = (ef.y + 0.5) * cs;
      ctx.strokeStyle = colors.food; ctx.fillStyle = colors.food; ctx.globalAlpha = 1 - ef.t; ctx.lineWidth = cs * 0.08;
      ctx.beginPath(); ctx.arc(ecx, ecy, cs * (0.4 + ef.t * 0.9), 0, Math.PI * 2); ctx.stroke();
      for (j = 0; j < 8; j++) {
        var an = j * Math.PI / 4 + 0.4, ds = cs * (0.3 + ef.t * 1.0), sz = cs * 0.13 * (1 - ef.t);
        ctx.fillRect(ecx + Math.cos(an) * ds - sz / 2, ecy + Math.sin(an) * ds - sz / 2, sz, sz);
      }
      ctx.globalAlpha = 1;
    }

    /* snake: tapered body, outlined silhouette, scales, head with eyes and tongue */
    var L = snake.length, P = [], R = [], LC = [];
    for (k = 0; k < L; k++) {
      var loc = 0;
      if (state === 'over') loc = 1;
      else if (state === 'dying') loc = Math.max(0, Math.min(1, dieT * 1.6 - (k / L) * 0.6));
      P[k] = pos(k, t); LC[k] = loc;
      R[k] = cs * (k === 0 ? 0.5 : 0.41 - 0.14 * (k / Math.max(L - 1, 1))) * (1 - loc);
    }
    var hd = dir, hpx = -hd.y, hpy = hd.x, hx = (P[0].x + 0.5) * cs, hy = (P[0].y + 0.5) * cs, hr = R[0];
    if (!dying && hr > 0 && Math.sin(ts / 300) > 0.55) {
      var tipx = hx + hd.x * (hr + cs * 0.4), tipy = hy + hd.y * (hr + cs * 0.4);
      ctx.strokeStyle = colors.food; ctx.lineWidth = cs * 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx + hd.x * hr * 0.8, hy + hd.y * hr * 0.8); ctx.lineTo(tipx, tipy);
      ctx.moveTo(tipx, tipy); ctx.lineTo(tipx + (hd.x + hpx * 0.8) * cs * 0.12, tipy + (hd.y + hpy * 0.8) * cs * 0.12);
      ctx.moveTo(tipx, tipy); ctx.lineTo(tipx + (hd.x - hpx * 0.8) * cs * 0.12, tipy + (hd.y - hpy * 0.8) * cs * 0.12);
      ctx.stroke();
    }
    function pass(dy, extra, colorFn){
      ctx.lineCap = 'round';
      for (var q = L - 1; q >= 0; q--) {
        var r = R[q]; if (r <= 0.5) continue;
        var a = P[q], ax = (a.x + 0.5) * cs, ay = (a.y + 0.5) * cs + dy, col = colorFn(q);
        ctx.fillStyle = col; ctx.strokeStyle = col;
        if (q < L - 1 && R[q + 1] > 0.5) {
          var b = P[q + 1];
          if (Math.abs(a.x - b.x) <= 1.5 && Math.abs(a.y - b.y) <= 1.5) {
            ctx.lineWidth = r + R[q + 1] + extra * 2;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo((b.x + 0.5) * cs, (b.y + 0.5) * cs + dy); ctx.stroke();
          }
        }
        dot(ax, ay, r + extra);
      }
    }
    pass(cs * 0.08, cs * 0.05, function(){ return 'rgba(20,22,31,0.16)'; });
    pass(0, cs * 0.055, function(){ return colors.ink; });
    pass(0, 0, function(q){ return LC[q] > 0.05 ? colors.food : (q === 0 ? colors.head : colors.snake); });
    for (k = 1; k < L; k++) {
      if (LC[k] > 0.05 || R[k] <= 0.5) continue;
      var sx = (P[k].x + 0.5) * cs, sy = (P[k].y + 0.5) * cs;
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; dot(sx - R[k] * 0.22, sy - R[k] * 0.28, R[k] * 0.36);
      if (k % 2 === 0) { ctx.fillStyle = 'rgba(20,22,31,0.13)'; dot(sx + R[k] * 0.25, sy + R[k] * 0.3, R[k] * 0.26); }
    }
    if (hr > 0.5) {
      var es = hr * 0.5, fw = hr * 0.22, er = cs * 0.15 * (hr / (cs * 0.5)), look = {x: hd.x, y: hd.y};
      if (food) {
        var lx = food.x - P[0].x, ly = food.y - P[0].y, ll = Math.sqrt(lx * lx + ly * ly);
        if (ll > 0.01) look = {x: lx / ll, y: ly / ll};
      }
      [-1, 1].forEach(function(sg){
        var ex = hx + hd.x * fw + hpx * es * sg, ey = hy + hd.y * fw + hpy * es * sg;
        if (dying) {
          var xq = cs * 0.08 * (hr / (cs * 0.5));
          ctx.strokeStyle = colors.ink; ctx.lineWidth = cs * 0.06; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(ex - xq, ey - xq); ctx.lineTo(ex + xq, ey + xq);
          ctx.moveTo(ex + xq, ey - xq); ctx.lineTo(ex - xq, ey + xq); ctx.stroke();
        } else {
          ctx.fillStyle = '#ffffff'; dot(ex, ey, er);
          ctx.fillStyle = colors.ink; dot(ex + look.x * er * 0.4, ey + look.y * er * 0.4, er * 0.52);
        }
      });
    }
    /* crash flash */
    if (flash > 0) {
      ctx.fillStyle = colors.food; ctx.globalAlpha = flash * 0.35; ctx.fillRect(0, 0, W, W); ctx.globalAlpha = 1;
      flash -= 0.04;
    }
  }
  function frame(ts){
    var dt = Math.min(ts - lastTs, 100); lastTs = ts;
    if (state === 'dying') {
      dieT += dt / 800;
      shake = Math.max(0, 1 - dieT * 1.6);
      if (dieT >= 1) { state = 'over'; shake = 0; updateHud(); showOverlay(); }
    }
    if (state === 'play') {
      acc += dt;
      var ms = tickMs();
      while (acc >= ms && state === 'play') { acc -= ms; step(); ms = tickMs(); }
    }
    draw(ts);
    requestAnimationFrame(frame);
  }

  resize(); reset();
  requestAnimationFrame(function(ts){ lastTs = ts; frame(ts); });
})();
</script>
</body>
</html>
